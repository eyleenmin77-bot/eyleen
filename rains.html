<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rains presentation | Eyleen Min</title><link rel="icon" type="image/png" href="icon.png"><link rel="stylesheet" href="styles.css"></head>
<body><header class="site-header"><a class="brand" href="index.html">Eyleen Min</a><a class="home-link" href="projects.html">← PROJECTS</a></header><main class="page slide-page"><section class="retro page-window"><div class="titlebar"><span>RAINS_PRESENTATION.EXE</span><a class="close" href="projects.html">×</a></div><div class="page-content graph-paper"><h1>Rains</h1><p class="lead">Move through the presentation at your own pace with the arrows or your keyboard.</p><div class="slide-frame"><img id="rains-slide" src="rains-slide-01.jpg" alt="Rains presentation slide 1 of 16"></div><nav class="slide-controls" aria-label="Presentation controls"><button type="button" id="prev-slide" class="button secondary" aria-label="Previous slide">← Previous</button><output id="slide-number" aria-live="polite">1 / 16</output><button type="button" id="next-slide" class="button" aria-label="Next slide">Next →</button></nav><p class="slide-note">This version lets you navigate slide by slide. Canva animations are not contained in a PDF. <a href="rains-deck.pdf" target="_blank">Open the PDF</a> if you prefer.</p></div></section></main><footer class="taskbar"><a class="start" href="index.html">🎀 HOME</a><div class="task-title">Rains presentation</div><div data-clock></div></footer><script src="script.js"></script><script>
(()=>{let current=1;const total=16,image=document.getElementById('rains-slide'),number=document.getElementById('slide-number'),previous=document.getElementById('prev-slide'),next=document.getElementById('next-slide');function show(n){current=Math.max(1,Math.min(total,n));image.src='rains-slide-'+String(current).padStart(2,'0')+'.jpg';image.alt='Rains presentation slide '+current+' of '+total;number.textContent=current+' / '+total;previous.disabled=current===1;next.disabled=current===total}previous.addEventListener('click',()=>show(current-1));next.addEventListener('click',()=>show(current+1));document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(current-1);if(e.key==='ArrowRight')show(current+1)});show(1)})();
</script></body></html>
